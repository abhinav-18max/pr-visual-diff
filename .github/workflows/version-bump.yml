name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"
      
      - name: Bump version in root package.json
        id: new_version
        run: |
          npm version ${{ github.event.inputs.bump_type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"
      
      - name: Update workspace packages versions
        run: |
          NEW_VERSION=${{ steps.new_version.outputs.version }}
          
          # Update all workspace package.json files
          for pkg in packages/*/package.json; do
            echo "Updating $pkg to version $NEW_VERSION"
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('$pkg', 'utf8'));
              pkg.version = '$NEW_VERSION';
              fs.writeFileSync('$pkg', JSON.stringify(pkg, null, 2) + '\n');
            "
          done
      
      - name: Update CHANGELOG.md
        run: |
          NEW_VERSION=${{ steps.new_version.outputs.version }}
          DATE=$(date +%Y-%m-%d)
          
          # Create new changelog entry
          sed -i.bak "s/## \[Unreleased\]/## [Unreleased]\n\n## [$NEW_VERSION] - $DATE/" CHANGELOG.md
          rm CHANGELOG.md.bak || true
          
          echo "Updated CHANGELOG.md with version $NEW_VERSION"
      
      - name: Commit version bump
        run: |
          NEW_VERSION=${{ steps.new_version.outputs.version }}
          git add .
          git commit -m "chore: bump version to $NEW_VERSION"
          git push origin main
      
      - name: Create and push tag
        run: |
          NEW_VERSION=${{ steps.new_version.outputs.version }}
          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"
          echo "✅ Created and pushed tag v$NEW_VERSION"
      
      - name: Summary
        run: |
          echo "## 🎉 Version Bump Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Old Version:** ${{ steps.current_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **New Version:** ${{ steps.new_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bump Type:** ${{ github.event.inputs.bump_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** v${{ steps.new_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The publish workflow will be triggered automatically by the tag push." >> $GITHUB_STEP_SUMMARY
