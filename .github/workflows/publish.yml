name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.2.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Configure npm authentication
        run: |
          npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
      
      - name: Install dependencies
        run: npm install
      
      - name: Run tests
        run: npm test
        continue-on-error: false
      
      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi
      
      - name: Publish packages to npm
        run: npm run publish-packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.version }}
          if grep -q "## \[$VERSION\]" CHANGELOG.md; then
            CHANGELOG=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d')
          else
            CHANGELOG="See [CHANGELOG.md](https://github.com/abhinav-18max/pr-visual-diff/blob/main/CHANGELOG.md) for details."
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## 📦 npm Packages Published
            
            - [pr-visual-diff@${{ steps.version.outputs.version }}](https://www.npmjs.com/package/pr-visual-diff)
            - [@pr-visual-diff/core@${{ steps.version.outputs.version }}](https://www.npmjs.com/package/@pr-visual-diff/core)
            - [@pr-visual-diff/git@${{ steps.version.outputs.version }}](https://www.npmjs.com/package/@pr-visual-diff/git)
            - [@pr-visual-diff/runner@${{ steps.version.outputs.version }}](https://www.npmjs.com/package/@pr-visual-diff/runner)
            - [@pr-visual-diff/reporter@${{ steps.version.outputs.version }}](https://www.npmjs.com/package/@pr-visual-diff/reporter)
            - [@pr-visual-diff/diff-engine@${{ steps.version.outputs.version }}](https://www.npmjs.com/package/@pr-visual-diff/diff-engine)
            - [@pr-visual-diff/screenshots@${{ steps.version.outputs.version }}](https://www.npmjs.com/package/@pr-visual-diff/screenshots)
            
            ## 📝 Changes
            
            ${{ steps.changelog.outputs.changelog }}
            
            ## 🚀 Installation
            
            ```bash
            npm install pr-visual-diff@${{ steps.version.outputs.version }}
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Post-publish verification
        run: |
          echo "✅ Verifying published packages..."
          sleep 30
          npm view pr-visual-diff@${{ steps.version.outputs.version }} version || echo "⚠️ Main package not yet visible on npm (may take a few minutes)"
          npm view @pr-visual-diff/core@${{ steps.version.outputs.version }} version || echo "⚠️ Core package not yet visible on npm (may take a few minutes)"
